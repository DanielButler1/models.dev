# Sources:
# - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing (Claude Opus 4.6: $5/$25, cache $0.50/$6.25)
# - https://raw.githubusercontent.com/github/docs/main/data/tables/copilot/models-and-pricing.yml
# - https://docs.github.com/en/copilot/reference/ai-models/supported-models (GA; configurable reasoning; optional 1M context)
# - https://github.blog/changelog/2026-02-05-claude-opus-4-6-is-now-generally-available-for-github-copilot/
# - Lab: models/anthropic/claude-opus-4-6.toml; peers: providers/github-copilot/models/claude-sonnet-4.6.toml, claude-opus-4.7.toml
# Pricing: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
base_model = "anthropic/claude-opus-4-6"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high", "max"] }, { type = "budget_tokens", min = 1_024, max = 32_000 }]

[cost]
input = 5
output = 25
cache_read = 0.5
cache_write = 6.25

[limit]
context = 200_000
input = 168_000
output = 32_000
