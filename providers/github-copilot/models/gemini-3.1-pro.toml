# Sources:
# - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# - https://docs.github.com/en/copilot/reference/ai-models/supported-models
# - https://github.blog/changelog/2026-02-19-gemini-3-1-pro-is-now-in-public-preview-in-github-copilot/
# - https://api.githubcopilot.com/models
# Pricing: Gemini 3.1 Pro public preview $2/$0.20/$12 per 1M (≤200k input); $4/$0.40/$18 (>200k)
# Reasoning: effort low|medium|high (matches lab google/gemini-3.1-pro-preview + github-copilot gemini-3.7/3.8-flash peers)
base_model = "google/gemini-3.1-pro-preview"
name = "Gemini 3.1 Pro"
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]

[cost]
input = 2.00
output = 12.00
cache_read = 0.20

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 4.00
output = 18.00
cache_read = 0.40

[limit]
context = 1_000_000
input = 936_000
output = 64_000
